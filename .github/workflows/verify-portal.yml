name: Verify portal
on:
  push:
    branches: [main, visual-v14]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test desktop and mobile layouts
        run: |
          python3 -m http.server 8000 >/tmp/portal-server.log 2>&1 &
          node tests/portal-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-screenshots
          path: /tmp/portal-*.png
          if-no-files-found: ignore
